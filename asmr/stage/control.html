<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASMR Control</title>
  <style>
    :root {
      --bg: #f6f3ef; --panel: #ffffff; --ink: #2b2420; --dim: #8a7f77; --line: #e6dfd8;
      --accent: #9c5b3c; --accent-ink: #ffffff; --log: #faf8f6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14110f; --panel: #1d1916; --ink: #efe7e0; --dim: #9b8f86; --line: #2f2925;
        --accent: #d08a66; --accent-ink: #1a120d; --log: #181512;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "PingFang SC", system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    h1 { grid-column: 1 / -1; margin: 0; font-size: 18px; font-weight: 600; }
    h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; font-size: 13px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: 0.04em; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    input, textarea { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    input.user { max-width: 120px; }
    textarea { min-height: 70px; resize: vertical; }
    button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
    #status { font-size: 12px; color: var(--dim); }
    #lib { grid-column: 1 / -1; }
    .group { margin-bottom: 12px; }
    .group h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--dim); }
    .acts { display: flex; flex-wrap: wrap; gap: 8px; }
    .act { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 3px; background: var(--bg); }
    .act button { border: none; padding: 4px 8px; }
    .act input { width: 52px; padding: 3px 4px; text-align: right; }
    .act.pinned input { border-color: var(--accent); }
    .act span { color: var(--dim); font-size: 12px; }
    .scale { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--dim); font-size: 13px; }
    .scale input { width: 220px; padding: 0; }
    #log { grid-column: 1 / -1; background: var(--log); max-height: 340px; overflow: auto; font-size: 12.5px; }
    #log div { padding: 4px 0; border-bottom: 1px dashed var(--line); word-break: break-all; }
    #log .dm { color: var(--accent); }
    label.toggle { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>ASMR 中控台 <small id="status">连接中…</small></h1>

  <section>
    <h2>模拟弹幕</h2>
    <div class="row">
      <input class="user" id="user" value="小明" placeholder="昵称">
      <input id="text" placeholder="弹幕内容，回车发送" value="今天好累啊">
      <button class="primary" id="send">发送</button>
    </div>
    <label class="toggle"><input type="checkbox" id="auto" style="width:auto"> 每 20 秒自动来一条随机弹幕</label>
    <div class="hint">真实的直播间弹幕抓取接入后，也是 POST 到 /api/danmaku。</div>
  </section>

  <section>
    <h2>中控插播</h2>
    <div class="chips" id="quick">
      <button data-s="[左][耳朵按摩][右][耳朵按摩]">按摩耳朵</button>
      <button data-s="[左][掏耳朵][右][掏耳朵]">掏耳朵</button>
      <button data-s="[左][刷耳朵][右][刷耳朵]">刷耳朵</button>
      <button data-s="[中]跟着灯光…[引导]慢慢吸气…[停顿][停顿]慢慢呼气…[停顿][停顿]">呼吸引导</button>
      <button data-s="[中][敲击]">交替敲击</button>
      <button data-s="[中][毛毡]">搓毛毡</button>
      <button data-s="[绕][刷子]">刷子</button>
      <button data-s="[中][呼吸]">呼吸</button>
      <button data-s="[中][灯光][毛毡]">交替灯光</button>
      <button data-s="[左]左耳…[右]右耳…[绕]绕一圈">左右耳测试</button>
    </div>
    <div class="row" style="margin-top:10px">
      <textarea id="script">[左]晚安呀…[敲击][右]今天也辛苦啦…[停顿][绕]慢慢放松就好[毛毡]</textarea>
    </div>
    <button class="primary" id="cue">插播这段脚本</button>
    <div class="hint">标签：[左] [右] [中] [绕]　[耳朵按摩] [掏耳朵] [刷耳朵] [敲击] [毛毡] [刷子] [呼吸]　[灯光] [引导] [停顿]</div>
  </section>

  <section>
    <h2>今日服装</h2>
    <div class="chips" id="outfits"></div>
    <div class="hint" id="outfitHint">按天自动轮换；点一套可以固定，点「按天轮换」恢复。</div>
  </section>

  <section id="lib">
    <h2>动作库 · 时长（秒）</h2>
    <div class="scale">全部动作时长 ×<input type="range" id="scale" min="0.5" max="3" step="0.1"><b id="scaleVal"></b></div>
    <div id="groups"></div>
    <div class="hint">点动作名立即插播；改右边的秒数会保存（高亮表示已单独设置，清空恢复默认）。脚本里也可以写 [耳朵按摩30] 临时指定。</div>
  </section>

  <section id="log"></section>
</main>
<script>
'use strict'
const $ = (id) => document.getElementById(id)
const log = $('log')
function addLog (text, cls) {
  const div = document.createElement('div')
  if (cls) div.className = cls
  div.textContent = `${new Date().toLocaleTimeString()}  ${text}`
  log.prepend(div)
  while (log.children.length > 200) log.lastChild.remove()
}
async function post (url, body) {
  const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  if (!resp.ok) addLog(`请求失败 ${resp.status}: ${await resp.text()}`)
}
function sendDanmaku (user, text) {
  if (!text.trim()) return
  post('/api/danmaku', { user, text })
}
$('send').onclick = () => { sendDanmaku($('user').value, $('text').value); $('text').value = '' }
$('text').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) $('send').click() }
$('cue').onclick = () => post('/api/cue', { script: $('script').value })
$('quick').onclick = (e) => { const s = e.target.dataset.s; if (s) post('/api/cue', { script: s }) }

const fakeUsers = ['月亮不睡', '小鹿', '加班狗', '晚风', '橘子汽水', '失眠星人', '阿哲', '团团']
const fakeTexts = ['晚上好', '今天好累啊', '能叫一下我的名字吗', '睡不着', '声音好好听', '刚下班', '想听敲击声', '明天要考试了好紧张', '左耳好舒服', '陪我待一会儿']
let autoTimer = 0
$('auto').onchange = (e) => {
  clearInterval(autoTimer)
  if (e.target.checked) {
    const fire = () => sendDanmaku(fakeUsers[Math.random() * fakeUsers.length | 0], fakeTexts[Math.random() * fakeTexts.length | 0])
    fire()
    autoTimer = setInterval(fire, 20000)
  }
}

async function loadOutfits () {
  const data = await (await fetch('/api/outfits')).json()
  const box = $('outfits')
  box.innerHTML = ''
  const mk = (label, name, on) => {
    const b = document.createElement('button')
    b.textContent = label
    if (on) b.className = 'primary'
    b.onclick = async () => { await post('/api/outfit', { name }); loadOutfits() }
    box.appendChild(b)
  }
  mk('按天轮换', null, !data.pinned)
  for (const name of data.outfits) mk(name.replace(/^\d+-/, ''), name, name === data.current && data.pinned)
  $('outfitHint').textContent = `当前：${data.current || '无素材'}（${data.pinned ? '已固定' : '按天轮换'}）`
}
loadOutfits()

const EAR_GROUP = '耳朵'
async function loadActions () {
  const data = await (await fetch('/api/actions')).json()
  $('scale').value = data.scale
  $('scaleVal').textContent = data.scale.toFixed(1)
  const groups = {}
  for (const a of data.actions) (groups[a.group] = groups[a.group] || []).push(a)
  const box = $('groups')
  box.innerHTML = ''
  for (const [name, list] of Object.entries(groups)) {
    const g = document.createElement('div')
    g.className = 'group'
    g.innerHTML = `<h3>${name}</h3><div class="acts"></div>`
    for (const a of list) {
      const el = document.createElement('div')
      el.className = 'act' + (a.pinned ? ' pinned' : '')
      const btn = document.createElement('button')
      btn.textContent = a.tag
      btn.onclick = () => post('/api/cue', { script: (name === EAR_GROUP ? '' : '[中]') + `[${a.tag}]` })
      const inp = document.createElement('input')
      inp.type = 'number'; inp.min = 2; inp.max = 120; inp.step = 1
      inp.value = a.seconds
      inp.title = `默认 ${a.default} 秒`
      inp.onchange = async () => {
        await post('/api/actions', { key: a.key, seconds: inp.value === '' ? null : Number(inp.value) })
        loadActions()
      }
      el.append(btn, inp, Object.assign(document.createElement('span'), { textContent: 's' }))
      g.querySelector('.acts').appendChild(el)
    }
    box.appendChild(g)
  }
}
$('scale').oninput = () => { $('scaleVal').textContent = Number($('scale').value).toFixed(1) }
$('scale').onchange = async () => { await post('/api/actions', { scale: Number($('scale').value) }); loadActions() }
loadActions()

async function refreshStatus () {
  try {
    const s = await (await fetch('/api/status')).json()
    $('status').textContent = `TTS: ${s.tts} · LLM: ${s.llm ? '已接入' : '未配置（用备用台词）'} · 待回复 ${s.pending_danmaku} · 已就绪 ${s.ready}` +
      (s.playing ? ` · 播放中 ${s.remaining.toFixed(1)}s` : '')
  } catch { $('status').textContent = '服务未连接' }
}
setInterval(refreshStatus, 1000)

function connect () {
  const ws = new WebSocket(`ws://${location.host}/ws`)
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data)
    if (msg.type === 'log') addLog(msg.text)
    else if (msg.type === 'danmaku') addLog(`弹幕 ${msg.user}：${msg.text}`, 'dm')
  }
  ws.onclose = () => setTimeout(connect, 2000)
  setInterval(() => ws.readyState === 1 && ws.send('ping'), 20000)
}
connect()
</script>
</body>
</html>
